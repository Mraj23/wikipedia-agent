# Human-readable mirror of src/prompts.py. src/prompts.py is the source of
# truth that the generators import. Edit there, then sync here.

# --- Eval prompt conditions (inference-time comparison arms) ---

plain: |
  Solve the task. Think step by step, then give the final answer.
  Question:
  {question}
  Return exactly:
  Reasoning: ...
  Answer: ...

concise: |
  Solve the task. Use brief reasoning. Avoid unnecessary words.
  Question:
  {question}
  Return exactly:
  Reasoning: ...
  Answer: ...

chain_of_draft: |
  Solve the task using concise draft reasoning.
  Keep only the key intermediate steps; each step a few words at most.
  Question:
  {question}
  Return exactly:
  Reasoning: ...
  Answer: ...

caveman: |
  Solve task. Respond terse like smart caveman. All logic stay. Only fluff die.
  Rules:
  - Drop articles, filler, pleasantries, hedging.
  - Fragments OK. Short words.
  - Names, objects, constraints, numbers: exact.
  - Show only necessary dependency chain. Arrows OK (X -> Y).
  - No restating problem. No "let me" / "let's".
  Question:
  {question}
  Return exactly:
  Reasoning: ...
  Answer: ...

# --- Judge critique (feedback modes) ---

judge_system_caveman: |
  You are a strict reasoning-compression critic.
  Given a question, gold answer, and model answer, provide feedback that helps
  the model revise into a shorter, correct caveman-style reasoning trace.
  Do not write the revised solution.
  Do not solve the task from scratch unless needed to explain the error.
  Focus on: correctness; necessary state transitions/constraints; redundant
  reasoning; missing or unsafe cuts; caveman-style compression.
  Return exactly: Verdict / Correctness / Keep / Cut / Merge / Unsafe Cuts /
  Revision Instruction.

judge_system_generic: |
  You are a reasoning-compression critic.
  Same correctness discipline, no caveman styling — used for the "does the
  caveman FEEDBACK content matter?" ablation.
  Return exactly: Verdict / Correctness / Keep / Cut / Revision Instruction.

judge_user: |
  Question:
  {question}

  Gold answer:
  {gold}

  Model first answer:
  {y0}

# --- Revision prompts ---

x1_with_feedback: |
  Original Question:
  {question}
  Your first answer:
  {y0}
  Feedback:
  {c0}
  Revise your answer using the feedback.
  Rules: caveman reasoning; preserve necessary transitions/constraints; remove
  filler; arrows where useful; return only Reasoning and Answer.

x1_no_feedback: |
  Original Question:
  {question}
  Your first answer:
  {y0}
  Revise your answer to be much shorter while keeping it correct.
  Rules: caveman reasoning; preserve necessary transitions/constraints; remove
  filler; return only Reasoning and Answer.
