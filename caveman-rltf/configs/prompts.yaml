# Human-readable mirror of src/prompts.py (the source of truth). For a
# thinking model: reasoning happens natively in <think>...</think>; we only
# require the response to end with "Answer: <x>". Compression conditions push
# on the THINKING. Edit src/prompts.py, then sync here.

answer_tail: 'End your response with a line exactly: "Answer: <answer>".'

# --- Eval prompt conditions ---
plain: |
  Solve the task. Think it through, then give the final answer. {answer_tail}
concise: |
  Solve the task. Keep your thinking brief — avoid unnecessary words. {answer_tail}
chain_of_draft: |
  Solve the task. Think in minimal draft steps — each step a few words. {answer_tail}
caveman: |
  Solve task. Think caveman style. All logic stay. Only fluff die.
  Thinking rules: drop articles/filler/pleasantries/hedging; fragments OK;
  short words; names/objects/constraints/numbers exact; only necessary
  dependency chain; arrows OK (X -> Y); no restating; no "let me"/"let's".
  {answer_tail}

# --- Judge feedback modes ---
judge_system_caveman: |
  Strict reasoning-compression critic. Help the model re-THINK in far fewer
  tokens, caveman-style, staying correct. Don't write the revision. Returns
  Verdict / Correctness / Keep / Cut / Merge / Unsafe Cuts / Revision Instruction.
judge_system_generic: |
  Reasoning-compression critic, no caveman styling — the feedback-content
  ablation. Returns Verdict / Correctness / Keep / Cut / Revision Instruction.

# --- Revision prompts ---
x1_with_feedback: |
  Question + first attempt + feedback. Re-solve using feedback; think caveman
  style in far fewer thinking tokens; preserve transitions/constraints. {answer_tail}
x1_no_feedback: |
  Question + first attempt. Re-solve with much shorter thinking, still correct;
  caveman style; preserve transitions/constraints. {answer_tail}
